<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maverick Bus</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    h1 span {
      color: #00eaff;
    }

    p {
      font-size: 16px;
      opacity: 0.9;
      margin-bottom: 30px;
    }

    button {
      background-color: #00eaff;
      color: #000;
      border: none;
      padding: 14px 30px;
      font-size: 16px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>MAVERICK <span>BUS</span></h1>
    <p>
      Smart College Bus Tracking <br/>
      Live Crowd • Routes • Notifications
    </p>
    <button>Get Started</button>
  </div>

</body>
</html>
