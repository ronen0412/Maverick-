<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Maverick – Smart Transport</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
* {
  box-sizing: border-box;
  font-family: 'Poppins', system-ui, sans-serif;
}

body {
  margin: 0;
  background: linear-gradient(180deg, #020617, #020617);
  color: white;
}

/* ---------- COMMON ---------- */
.page {
  display: none;
  min-height: 100vh;
  padding: 20px;
}

.page.active {
  display: block;
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(135deg, #38bdf8, #22d3ee);
  color: #020617;
  font-weight: 600;
  font-size: 16px;
  cursor: pointer;
}

.card {
  background: rgba(255,255,255,0.06);
  border-radius: 18px;
  padding: 18px;
  margin-top: 16px;
  backdrop-filter: blur(10px);
}

select, input {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 12px;
  border: none;
  background: rgba(255,255,255,0.1);
  color: white;
}

h2 {
  text-align: center;
  margin-top: 10px;
}

/* ---------- ROLE SELECT ---------- */
.role-btn {
  margin-top: 16px;
}

/* ---------- STUDENT TRACK ---------- */
.status {
  margin-top: 8px;
  font-weight: 600;
}

.low { color: #22c55e; }
.medium { color: #facc15; }
.high { color: #ef4444; }

#map {
  height: 260px;
  border-radius: 16px;
  margin-top: 14px;
}
</style>
</head>

<body>

<!-- ROLE SELECTION -->
<div class="page active" id="rolePage">
  <h2>Welcome to MAVERICK</h2>
  <p style="text-align:center;opacity:0.8;">Choose your role</p>

  <button class="role-btn" onclick="goStudent()">👨‍🎓 Continue as Student</button>
  <button class="role-btn" onclick="alert('Driver UI coming next')">🧑‍✈️ Bus Driver</button>
  <button class="role-btn" onclick="alert('Admin Dashboard coming next')">🏫 Admin</button>
</div>

<!-- STUDENT SETUP -->
<div class="page" id="studentSetup">
  <h2>Track Your Bus</h2>

  <div class="card">
    <label>Pickup Location</label>
    <input id="pickup" placeholder="e.g. Main Gate" />

    <label>Route</label>
    <select id="route">
      <option value="">Select Route</option>
      <option>Route A</option>
      <option>Route B</option>
    </select>

    <button style="margin-top:18px;" onclick="startTracking()">Start Tracking</button>
  </div>
</div>

<!-- STUDENT LIVE -->
<div class="page" id="studentLive">
  <h2>Live Bus Status</h2>

  <div class="card">
    <div><strong>Bus:</strong> College Bus 12</div>
    <div><strong>ETA:</strong> <span id="eta">6 mins</span></div>
    <div class="status medium" id="crowd">● Medium Crowd</div>
  </div>

  <div id="map"></div>

  <div class="card">
    <p>Missed this bus?</p>
    <button onclick="alert('Next buses feature coming')">See Next Buses</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
function goStudent(){
  showPage('studentSetup');
}

function startTracking(){
  const pickup = document.getElementById('pickup').value;
  const route = document.getElementById('route').value;
  if(!pickup || !route){
    alert('Please fill all fields');
    return;
  }
  showPage('studentLive');
  initMap();
}

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

let map, marker;
function initMap(){
  map = L.map('map').setView([12.9716,77.5946], 14);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  marker = L.marker([12.9716,77.5946]).addTo(map);

  let lat = 12.9716, lng = 77.5946;
  setInterval(()=>{
    lat += 0.0005;
    lng += 0.0005;
    marker.setLatLng([lat,lng]);
    map.panTo([lat,lng]);
  },1500);
}
</script>

</body>
</html>
